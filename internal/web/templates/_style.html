{{define "style"}}
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #14161a; color: #e6e6e6; }
a { color: #7ab8ff; text-decoration: none; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #1d2026; border-bottom: 1px solid #2a2e36; }
.topbar h1 { font-size: 18px; margin: 0; }
.topbar .spacer { flex: 1; }
.wrap { padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.card { display: block; background: #1d2026; border-radius: 8px; overflow: hidden; border: 1px solid #2a2e36; }
.card img { width: 100%; height: 210px; object-fit: cover; display: block; background: #0d0e11; }
.card .cap { padding: 8px 10px; font-size: 13px; line-height: 1.4; }
.card .cap small { color: #9aa0aa; }
button { background: #2e6bb8; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
button:hover { background: #3a7fd0; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 14px; background: #1d2026; border: 1px solid #2a2e36; border-radius: 8px; padding: 10px 14px; }
.row img { width: 44px; height: 62px; object-fit: cover; border-radius: 4px; background: #0d0e11; }
.row .title { flex: 1; font-size: 15px; }
.row small { color: #9aa0aa; }
.err { color: #ff9c8a; }
.center { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
form.card { width: 320px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
form.card label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
form.card input { padding: 9px 10px; border-radius: 6px; border: 1px solid #333844; background: #14161a; color: #e6e6e6; }
.empty { color: #9aa0aa; padding: 40px; text-align: center; }
/* 主页书库卡片管理 */
.card-wrap { position: relative; }
.cardmenu { position: absolute; top: 6px; right: 6px; z-index: 4; background: rgba(20,22,26,.85); color: #c6cad2; border: 1px solid #3a4050; border-radius: 6px; width: 30px; height: 30px; font-size: 16px; line-height: 1; cursor: pointer; visibility: hidden; }
.card-wrap:hover .cardmenu, .card-wrap:focus-within .cardmenu { visibility: visible; }
.cardmenu:hover { color: #fff; border-color: #7ab8ff; }
.menu { position: absolute; top: 40px; right: 6px; z-index: 5; min-width: 96px; background: #262a33; border: 1px solid #3a4050; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.5); overflow: hidden; }
.menu div { padding: 9px 14px; font-size: 14px; cursor: pointer; }
.menu div:hover { background: #2e6bb8; color: #fff; }
.menu .menu-danger:hover { background: #a33; }
/* 主页书库卡片:统一尺寸 */
#libgrid .card { height: 150px; }
.libcap { height: 100%; padding: 14px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.libcap strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.libcap small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; line-height: 1.5; }
.addcard { display: flex; align-items: center; justify-content: center; height: 150px; border-style: dashed; border-color: #3a4050; color: #9aa0aa; font-size: 15px; cursor: pointer; }
.addcard:hover { color: #e6e6e6; border-color: #7ab8ff; }
/* 管理页 */
.panel { background: #1d2026; border: 1px solid #2a2e36; border-radius: 8px; padding: 18px 20px; margin-bottom: 20px; }
.panel h2 { margin: 0 0 14px; font-size: 16px; }
.field { display: block; margin-bottom: 12px; font-size: 14px; color: #c6cad2; }
.field input { display: block; width: 100%; margin-top: 6px; padding: 9px 10px; border-radius: 6px; border: 1px solid #333844; background: #14161a; color: #e6e6e6; }
.pathrow { display: flex; gap: 8px; }
.pathrow input { flex: 1; }
button.danger { background: #a33; }
button.danger:hover { background: #c44; }
button.primary { background: #2e8b57; }
.libtable { width: 100%; border-collapse: collapse; }
.libtable td { padding: 8px 10px; border-top: 1px solid #2a2e36; font-size: 14px; }
.rootcell { color: #9aa0aa; font-family: Consolas, monospace; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
.hidden { display: none !important; }
.modal-card { width: min(640px, 92vw); max-height: 80vh; display: flex; flex-direction: column; background: #1d2026; border: 1px solid #3a4050; border-radius: 10px; padding: 14px; }
.brow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.curpath { flex: 1; font-family: Consolas, monospace; font-size: 13px; color: #c6cad2; word-break: break-all; }
.dirlist { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; border: 1px solid #2a2e36; border-radius: 6px; }
.dirlist li { padding: 8px 12px; cursor: pointer; font-size: 14px; }
.dirlist li:hover { background: #2a2e36; }
.dirlist li.nodirs { color: #9aa0aa; cursor: default; }
/* 阅读器 */
body.reader { background: #000; }
body.reader img.page { display: block; margin: 0 auto; max-width: 100%; height: auto; min-height: 100vh; object-fit: contain; }
.zones { position: fixed; inset: 0; display: flex; }
.zones a { flex: 1; }
.bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; align-items: center; gap: 20px; padding: 10px 20px; background: rgba(20,22,26,.9); font-size: 14px; }
.bar .spacer { flex: 1; }
</style>
{{end}}
